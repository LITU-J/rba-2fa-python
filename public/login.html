<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In — RBA-2FA</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29 0%, #1a1040 50%, #24243e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(139,92,246,0.18) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(79,70,229,0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(56,189,248,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrapper {
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.15);
      position: relative;
      z-index: 1;
    }

    .login-right {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .login-brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(139,92,246,0.5);
    }

    .login-brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .login-brand-sub {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
    }

    .login-right h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 32px;
      text-align: center;
    }

    .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      font-size: 0.95rem;
      color: #fff;
      background: rgba(255,255,255,0.07);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: #8b5cf6;
      background: rgba(139,92,246,0.1);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
    }

    .input-wrap input::placeholder { color: rgba(255,255,255,0.25); }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: rgba(255,255,255,0.35);
      padding: 0;
      transition: color 0.2s;
    }

    .eye-btn:hover { color: #a78bfa; }

    .sim-toggle {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
    }

    .sim-toggle:hover { border-color: #8b5cf6; color: #c4b5fd; }

    .sim-panel {
      display: none;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .sim-panel.open { display: block; }

    .sim-panel input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 0.88rem;
      background: rgba(255,255,255,0.06);
      margin-bottom: 10px;
      outline: none;
      color: #fff;
    }

    .sim-panel input::placeholder { color: rgba(255,255,255,0.25); }
    .sim-panel input:focus { border-color: #8b5cf6; }

    .ip-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ip-chip {
      background: rgba(139,92,246,0.2);
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .ip-chip:hover { background: rgba(139,92,246,0.35); color: #e9d5ff; }

    .signin-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      margin-top: 8px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(139,92,246,0.5);
    }

    .signin-btn:hover   { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(139,92,246,0.6); }
    .signin-btn:active  { transform: translateY(0); }
    .signin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.2);
      margin-bottom: 16px;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 43%;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .bottom-links {
      text-align: center;
      font-size: 0.86rem;
      color: rgba(255,255,255,0.4);
    }

    .bottom-links a {
      color: #a78bfa;
      font-weight: 700;
      text-decoration: none;
    }

    .bottom-links a:hover { color: #c4b5fd; text-decoration: underline; }

    .back-link {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.25);
      margin-top: 10px;
      text-decoration: none;
    }

    .back-link:hover { color: rgba(255,255,255,0.5); }

    #msg { margin-top: 4px; }

    .alert-error {
      background: rgba(239,68,68,0.12);
      color: #fca5a5;
      border: 1.5px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.86rem;
      font-weight: 600;
      margin-top: 12px;
    }

    /* NEW: amber warning for "X attempts remaining" */
    .alert-warning {
      background: rgba(251,146,60,0.14);
      color: #fed7aa;
      border: 1.5px solid rgba(251,146,60,0.45);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.86rem;
      font-weight: 600;
      margin-top: 12px;
      line-height: 1.5;
    }

    .alert-warning .warn-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fb923c;
      margin-bottom: 4px;
    }

    /* NEW: red critical warning for last attempt */
    .alert-danger {
      background: rgba(239,68,68,0.18);
      color: #fca5a5;
      border: 2px solid rgba(239,68,68,0.6);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 12px;
      line-height: 1.5;
      animation: pulse-border 1.2s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239,68,68,0.6); }
      50%       { border-color: rgba(239,68,68,1.0); box-shadow: 0 0 12px rgba(239,68,68,0.35); }
    }

    .alert-success {
      background: rgba(16,185,129,0.12);
      color: #6ee7b7;
      border: 1.5px solid rgba(16,185,129,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.86rem;
      font-weight: 600;
      margin-top: 12px;
    }

    /* NEW: locked account banner */
    .alert-locked {
      background: rgba(109,40,217,0.18);
      color: #ddd6fe;
      border: 1.5px solid rgba(139,92,246,0.45);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .alert-locked .lock-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
    .alert-locked .lock-timer { font-size: 1.1rem; font-weight: 800; color: #c4b5fd; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-right">

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand-icon">🛡️</div>
      <div>
        <div class="login-brand-name">RBA-2FA System</div>
        <div class="login-brand-sub">Adaptive Authentication</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your secured account</p>

    <label class="field-label">Username</label>
    <div class="input-wrap">
      <input type="text" id="username"
             placeholder="Enter your username"
             autocomplete="username"/>
    </div>

    <label class="field-label">Password</label>
    <div class="input-wrap">
      <input type="password" id="password"
             placeholder="Enter your password"
             autocomplete="current-password"
             style="padding-right:44px;"/>
      <button class="eye-btn" onclick="togglePwd()"
              id="eyeIcon">👁️</button>
    </div>

    <button class="sim-toggle" onclick="toggleSim()">
      🔬 Risk Engine Demo — Simulate IP location
    </button>

    <div class="sim-panel" id="simPanel">
      <input type="text" id="debugIp"
             placeholder="e.g. 41.182.0.1 (Windhoek)"/>
      <div class="ip-chips">
        <button class="ip-chip" onclick="setIp('41.182.0.1')">Windhoek</button>
        <button class="ip-chip" onclick="setIp('41.182.0.2')">Swakopmund</button>
        <button class="ip-chip" onclick="setIp('41.182.0.4')">Oshakati</button>
        <button class="ip-chip" onclick="setIp('196.216.2.1')">South Africa</button>
        <button class="ip-chip" onclick="setIp('203.0.113.5')">Japan</button>
        <button class="ip-chip" onclick="setIp('8.8.8.8')">USA</button>
      </div>
    </div>

    <button class="signin-btn" id="loginBtn" onclick="doLogin()">
      Sign In →
    </button>

    <div id="msg"></div>

    <div class="divider">or</div>

    <div class="bottom-links">
      Don't have an account?
      <a href="/register.html">Create one</a>
    </div>
    <a href="/reset.html" class="back-link">🔑 Forgot password?</a>
    <a href="/" class="back-link">← Back to home</a>

  </div>
</div>

<script>
function togglePwd() {
  const input = document.getElementById("password");
  const btn   = document.getElementById("eyeIcon");
  input.type  = input.type === "password" ? "text" : "password";
  btn.textContent = input.type === "password" ? "👁️" : "🙈";
}

function toggleSim() {
  document.getElementById("simPanel").classList.toggle("open");
}

function setIp(ip) {
  document.getElementById("debugIp").value = ip;
  document.getElementById("simPanel").classList.add("open");
}

/* ── Message helpers ───────────────────────────────────────────── */
function showMsg(html, type) {
  document.getElementById("msg").innerHTML =
    `<div class="alert-${type}">${html}</div>`;
}
function clearMsg() { document.getElementById("msg").innerHTML = ""; }
</script>
<script src="/js/login.js"></script>
</body>
</html>
