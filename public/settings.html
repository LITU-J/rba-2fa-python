<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Account Settings — RBA-2FA</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    html, body {
      background: #f0f4ff !important;
      min-height: 100vh !important;
    }
    .navbar {
      background: #ffffff !important;
      border-bottom: 1px solid #e2e8f0 !important;
      box-shadow: 0 2px 8px rgba(99,102,241,0.06) !important;
      backdrop-filter: none !important;
    }
    .nav-brand { color: #1e293b !important; }
    .navbar .btn-outline {
      background: #ffffff !important;
      color: #374151 !important;
      border: 1.5px solid #d1d5db !important;
      border-radius: 10px !important;
    }
    .navbar .btn-outline:hover {
      background: #f8fafc !important;
      border-color: #8b5cf6 !important;
      color: #7c3aed !important;
    }
    .nav-user { color: #374151 !important; }
    body > div h1, body > div > div h1 { color: #1e293b !important; }
    body > div > div > p { color: #64748b !important; }
    .card {
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: 0 2px 8px rgba(99,102,241,0.06) !important;
    }
    .card h3 { color: #1e293b !important; }
    .form-group label { color: #374151 !important; font-weight: 600 !important; }
    .form-group input {
      background: #ffffff !important;
      border: 1.5px solid #d1d5db !important;
      color: #1e293b !important;
    }
    .form-group input:focus {
      border-color: #8b5cf6 !important;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.15) !important;
    }
    .form-group input::placeholder { color: #9ca3af !important; }
    .btn-primary {
      background: linear-gradient(135deg,#8b5cf6,#4f46e5) !important;
      color: #fff !important;
      border: none !important;
      box-shadow: 0 4px 14px rgba(139,92,246,0.35) !important;
    }
    .alert, .alert-error {
      background: #fef2f2 !important;
      color: #991b1b !important;
      border: 1.5px solid #fecaca !important;
      border-radius: 10px !important;
    }
    .alert-success {
      background: #f0fdf4 !important;
      color: #166534 !important;
      border: 1.5px solid #bbf7d0 !important;
      border-radius: 10px !important;
    }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/dashboard.html" class="nav-brand"><span>🔐</span> RBA-2FA System</a>
  <div class="nav-actions">
    <span class="nav-user" id="navUser"></span>
    <a href="/dashboard.html" class="btn btn-outline">← Dashboard</a>
  </div>
</nav>

<div style="max-width:620px;margin:40px auto;padding:0 24px;">

  <div style="margin-bottom:28px;">
    <h1 style="margin-bottom:6px;color:#1e293b;">⚙️ Account Settings</h1>
    <p style="color:#64748b;">Update your account information and security preferences.</p>
  </div>

  <!-- Profile card -->
  <div class="card" style="margin-bottom:24px;">
    <h3 style="margin-bottom:20px;">👤 Profile Information</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <div style="font-size:0.78rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px;">Username</div>
        <div id="infoUsername" style="font-size:1rem;font-weight:600;color:#1e293b;">—</div>
      </div>
      <div>
        <div style="font-size:0.78rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px;">Email</div>
        <div id="infoEmail" style="font-size:1rem;font-weight:600;color:#1e293b;">—</div>
      </div>
      <div>
        <div style="font-size:0.78rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px;">Phone</div>
        <div id="infoPhone" style="font-size:1rem;font-weight:600;color:#1e293b;">—</div>
      </div>
      <div>
        <div style="font-size:0.78rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px;">Authenticator</div>
        <div id="infoTotp" style="font-size:1rem;font-weight:600;">—</div>
      </div>
    </div>
  </div>

  <!-- Change password -->
  <div class="card" style="margin-bottom:24px;">
    <h3 style="margin-bottom:20px;">🔑 Change Password</h3>
    <div class="form-group">
      <label>Current password</label>
      <div style="position:relative;">
        <input type="password" id="currentPwd" placeholder="Enter current password" style="padding-right:44px;"/>
        <button type="button" onclick="togglePwd('currentPwd','e1')" id="e1"
          style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:#9ca3af;">👁️</button>
      </div>
    </div>
    <div class="form-group">
      <label>New password</label>
      <div style="position:relative;">
        <input type="password" id="newPwd" placeholder="Minimum 8 characters" style="padding-right:44px;"/>
        <button type="button" onclick="togglePwd('newPwd','e2')" id="e2"
          style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:#9ca3af;">👁️</button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm new password</label>
      <div style="position:relative;">
        <input type="password" id="confirmPwd" placeholder="Repeat new password" style="padding-right:44px;"/>
        <button type="button" onclick="togglePwd('confirmPwd','e3')" id="e3"
          style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:#9ca3af;">👁️</button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
    <div id="pwdMsg"></div>
  </div>

  <!-- Security summary -->
  <div class="card">
    <h3 style="margin-bottom:16px;">🛡️ Security Summary</h3>
    <div id="securitySummary" style="display:grid;gap:10px;"></div>
  </div>

</div>

<script>
function togglePwd(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn   = document.getElementById(btnId);
  input.type  = input.type === "password" ? "text" : "password";
  btn.textContent = input.type === "password" ? "👁️" : "🙈";
}

async function init() {
  const res = await fetch("/api/auth/me");
  if (!res.ok) { location.href = "/login.html"; return; }
  const { user, lastLogin } = await res.json();

  document.getElementById("navUser").textContent     = `👤 ${user.username}`;
  document.getElementById("infoUsername").textContent = user.username;
  document.getElementById("infoEmail").textContent    = user.email;
  document.getElementById("infoPhone").textContent    = user.phone || "Not set";
  document.getElementById("infoTotp").innerHTML       = user.totp_enabled
    ? `<span style="color:#059669;">✅ Enabled</span>`
    : `<span style="color:#dc2626;">❌ Not set up — <a href="/dashboard.html" style="color:#7c3aed;font-weight:600;">Set up now</a></span>`;

  document.getElementById("securitySummary").innerHTML = `
    <div style="display:flex;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;">
      <span style="font-weight:600;font-size:0.9rem;color:#1e293b;">Last login</span>
      <span style="color:#64748b;font-size:0.88rem;">${lastLogin ? lastLogin.timestamp : "Never"}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;">
      <span style="font-weight:600;font-size:0.9rem;color:#1e293b;">Last login location</span>
      <span style="color:#64748b;font-size:0.88rem;">${lastLogin && lastLogin.city && lastLogin.city !== "Local Network" ? lastLogin.city+", "+lastLogin.country : "Local Network"}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;">
      <span style="font-weight:600;font-size:0.9rem;color:#1e293b;">Last risk tier</span>
      <span>${lastLogin ? `<span class="badge badge-${lastLogin.risk_tier}">${lastLogin.risk_tier}</span>` : "—"}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;">
      <span style="font-weight:600;font-size:0.9rem;color:#1e293b;">Authenticator app</span>
      <a href="/dashboard.html" style="color:#7c3aed;font-size:0.88rem;font-weight:600;">
        ${user.totp_enabled ? "Manage →" : "Set up now →"}
      </a>
    </div>`;
}

async function changePassword() {
  const current = document.getElementById("currentPwd").value;
  const newPwd  = document.getElementById("newPwd").value;
  const confirm = document.getElementById("confirmPwd").value;
  const msg     = document.getElementById("pwdMsg");
  msg.innerHTML = "";

  if (!current || !newPwd || !confirm) {
    msg.innerHTML = `<div class="alert alert-error" style="margin-top:12px;">❌ Please fill in all three fields.</div>`; return;
  }
  if (newPwd.length < 8) {
    msg.innerHTML = `<div class="alert alert-error" style="margin-top:12px;">❌ New password must be at least 8 characters.</div>`; return;
  }
  if (newPwd !== confirm) {
    msg.innerHTML = `<div class="alert alert-error" style="margin-top:12px;">❌ New passwords do not match.</div>`; return;
  }

  const res  = await fetch("/api/auth/change-password", {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify({ current_password: current, new_password: newPwd }),
  });
  const data = await res.json();

  if (!res.ok) {
    msg.innerHTML = `<div class="alert alert-error" style="margin-top:12px;">❌ ${data.error}</div>`;
  } else {
    msg.innerHTML = `<div class="alert alert-success" style="margin-top:12px;">✅ Password updated successfully.</div>`;
    document.getElementById("currentPwd").value = "";
    document.getElementById("newPwd").value     = "";
    document.getElementById("confirmPwd").value = "";
  }
}

init();
</script>
</body>
</html>
